[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
# --connect-under-reset is required because the firmware claims the same
# USB Serial/JTAG peripheral that the built-in probe attaches to.
runner = "probe-rs run --chip esp32c3 --connect-under-reset"

[env]
DEFMT_LOG = "info"
