[build]
target = "riscv32imfc-unknown-none-elf.json"

[unstable]
build-std = ["core", "alloc"]
json-target-spec = true

[target.riscv32imfc-unknown-none-elf]
# probe-rs can also flash/debug the CH32V305 over its WCH RISC-V interface.
runner = "probe-rs run --chip CH32V305RBT6 --connect-under-reset"

[env]
DEFMT_LOG = "info"
